<style>
:root {
  --bg: #FEF9F1; --paper: #FFFFFF; --sand: #F4EDDF; --line: #E6DCCB;
  --ink: #39302E; --brown: #583E36; --black: #1C1A17; --espresso: #3A2E2B;

  --display: "Oswald", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --logo-url: url("https://tastydose.com/cdn/shop/files/LOGO_td_dark.png?v=1778152107&width=400");
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; }
.app { max-width: 520px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
.logo { display: block; width: 132px; height: 38px; background: var(--brown); -webkit-mask: var(--logo-url) left center / contain no-repeat; mask: var(--logo-url) left center / contain no-repeat; }
.wordmark { font: 600 26px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; color: var(--brown); }
.status { display: flex; align-items: center; gap: 7px; font: 500 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--brown); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: #3F7A52; box-shadow: 0 0 0 3px rgba(63,122,82,.15); }

#log { flex: 1; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }

.hero { background: var(--espresso); color: var(--cream); border-radius: 22px; padding: 20px 20px 22px; display: flex; gap: 16px; align-items: center; box-shadow: 0 16px 36px rgba(46,36,33,.22); margin-bottom: 4px; }
.polaroid { flex: none; background: #FBF7F0; padding: 7px 7px 0; width: 92px; transform: rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.28); position: relative; }
.polaroid .tape { position: absolute; top: -8px; left: 50%; width: 46px; height: 14px; background: rgba(230,190,118,.78); transform: translateX(-50%) rotate(-5deg); }

.polaroid .photo svg { width: 46%; }

.hero .eyebrow { font: 500 11px var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--caramel); }
.hero h1 { font-family: var(--display); font-weight: 500; font-size: 30px; line-height: 1.02; text-transform: uppercase; margin: 4px 0 6px; letter-spacing: .01em; }
.hero p { margin: 0; font-size: 14.5px; line-height: 1.45; color: #E9DCCB; }

.msg { max-width: 86%; padding: 11px 14px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; overflow-wrap: anywhere; animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.user { align-self: flex-end; background: var(--espresso); color: var(--cream); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.bot p { margin: 0 0 8px; } .bot p:last-child { margin: 0; }
.bot ul, .bot ol { margin: 4px 0 8px; padding-left: 20px; } .bot li { margin: 2px 0; }
.bot a { color: var(--brown); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.bot strong { font-weight: 600; }
.err { border-color: #E9B8A9; background: #FFF6F2; }

.typing { display: inline-flex; gap: 5px; padding: 15px 16px; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--caramel); animation: blink 1.2s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 4px; }
.chip { appearance: none; border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 13px; font: 500 13.5px var(--body); cursor: pointer; text-align: left; transition: background .15s, color .15s; }
.chip:hover { background: var(--ink); color: #fff; }

form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg); }
textarea { flex: 1; resize: none; max-height: 120px; min-height: 48px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 13px 14px; font: 400 16px/1.35 var(--body); }
textarea::placeholder { color: #9A8B80; }
.send { flex: none; width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--black); color: #fff; cursor: pointer; display: grid; place-items: center; transition: transform .12s, opacity .15s; }
.send:active { transform: scale(.95); }
.send:disabled { opacity: .35; cursor: default; }
.note { font-size: 11.5px; line-height: 1.45; color: var(--brown); opacity: .8; text-align: center; padding: 0 18px 10px; margin: 0; background: var(--bg); }
:focus-visible { outline: 2px solid var(--brown); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .msg, .typing span { animation: none; } #log { scroll-behavior: auto; } }

  for (const p of (navigator.languages || [navigator.language || "en"])) {
    const c = p.slice(0, 2).toLowerCase();
    if (T[c]) return c;
  }
  return "en";
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function inline(s) {
  s = esc(s);
  const links = [];
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, txt, url) => { links.push(`<a href="${url}" target="_blank" rel="noopener">${txt}</a>`); return `\u0000${links.length - 1}\u0000`; });
  s = s.replace(/(https?:\/\/[^\s<)]+[^\s<).,!?])/g, u => { links.push(`<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, "")}</a>`); return `\u0000${links.length - 1}\u0000`; });
  s = s.replace(/([\w.+-]+@[\w-]+\.[\w.]+[a-z])/gi, m => `<a href="mailto:${m}">${m}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => links[+i]);
  return s;
}
function md(text) {
  const out = []; let list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (m) {
      const type = /^\d/.test(line) ? "ol" : "ul";
      if (!list || list.type !== type) { if (list) out.push(`</${list.type}>`); list = { type }; out.push(`<${type}>`); }
      out.push(`<li>${inline(m[1])}</li>`);
      continue;
    }
    if (list) { out.push(`</${list.type}>`); list = null; }
    if (line) out.push(`<p>${inline(line.replace(/^#+\s*/, ""))}</p>`);
  }
  if (list) out.push(`</${list.type}>`);
  return out.join("");
}

function add(role, content, extra) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot") + (extra ? " " + extra : "");
  if (role === "user") d.textContent = content; else d.innerHTML = md(content);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  const chips = $("chips"); if (chips) chips.remove();
  add("user", text);
  history.push({ role: "user", content: text });
  input.value = ""; resize();

  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  log.appendChild(typing); log.scrollTop = log.scrollHeight;

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const data = await r.json().catch(() => ({}));
    typing.remove();
    if (!r.ok || !data.reply) throw new Error(data.error || "error");
    add("bot", data.reply);
    history.push({ role: "assistant", content: data.reply });
  } catch (e) {
    typing.remove();
    history.pop(); // let the user retry the same question
    add("bot", t.err, "err");
  } finally {
    busy = false;
    send.disabled = !input.value.trim();
    input.focus();
  }
}

function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
input.addEventListener("input", () => { resize(); send.disabled = busy || !input.value.trim(); });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
</script>
